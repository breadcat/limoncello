<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="summary">{{SUMMARY}}</div>

<details open>
  <summary>Calendar</summary>
  <div class="details-inner">
    <div class="month-nav">
      <button class="btn-nav" onclick="shiftMonth(-1)">◀ Prev</button>
      <span class="month-label" id="month-label">{{MONTH_LABEL}}</span>
      <button class="btn-nav" id="month-next-btn" onclick="shiftMonth(1)" disabled>Next ▶</button>
    </div>
    <div class="month-weekday-header">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="month-grid" id="month-grid">{{MONTH_GRID}}</div>
  </div>
</details>

<details>
  <summary>Summary</summary>
  <div class="details-inner">
    <div class="period-toggle">
      <button class="btn-nav active" id="mode-weeks" onclick="setPeriodMode('weeks')">Weeks</button>
      <button class="btn-nav" id="mode-months" onclick="setPeriodMode('months')">Months</button>
    </div>
    <div class="period-list" id="period-list">{{PERIODS}}</div>
  </div>
</details>

<div class="legend">
  <div class="legend-item"><div class="legend-dot zero"></div>0</div>
  <div class="legend-item"><div class="legend-dot blue"></div>&lt;2</div>
  <div class="legend-item"><div class="legend-dot green"></div>&lt;4</div>
  <div class="legend-item"><div class="legend-dot yellow"></div>&lt;8</div>
  <div class="legend-item"><div class="legend-dot orange"></div>&lt;14</div>
  <div class="legend-item"><div class="legend-dot red"></div>&lt;20</div>
  <div class="legend-item"><div class="legend-dot purple"></div>&lt;30</div>
  <div class="legend-item"><div class="legend-dot black"></div>30+</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
